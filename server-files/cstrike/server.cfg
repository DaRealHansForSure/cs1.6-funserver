// LAN Fun Server - general settings.
// Game rules per mode live in modes\*.cfg, not here.

hostname "LAN Fun Server"
sv_lan 1
sv_contact ""

// Leave empty = everybody on the LAN may join
sv_password ""
// The RCON password lives in local.cfg (created by the
// Server Control window). Setting it here would wipe it on every map start.

// Network: on a LAN we can afford more bandwidth
sv_maxrate 100000
sv_minrate 20000
sv_maxupdaterate 102
sv_minupdaterate 30
sys_ticrate 1000

// Downloads: maps and sounds come from the fast download server
sv_allowdownload 1
sv_allowupload 1
sv_send_resources 1
sv_send_logos 1

// Everybody hears and reads everybody, more fun at a LAN
sv_alltalk 1
sv_allchat 1
sv_voiceenable 1

mp_footsteps 1
mp_flashlight 1
mp_decals 300
mp_chattime 6
mp_tkpunish 0
mp_hostagepenalty 0
mp_fadetoblack 0

log on
sv_logbans 0
