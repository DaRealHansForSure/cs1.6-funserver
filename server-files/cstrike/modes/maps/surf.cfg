// Surf maps (surf_...) in any mode. fun_modes.amxx runs this after the mode
// config, base.cfg undoes it on the next map.

// Surfing only works with a high air acceleration, the CS default of 10
// makes you slide off the ramps
sv_airaccelerate 100

// Missing a ramp means a long fall, that should cost the run, not the life
mp_falldamage 0

// Bots can not surf
bot_quota 0
