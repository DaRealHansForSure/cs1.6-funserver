// Runs before every mode and resets everything to normal CS,
// so nothing from another mode sticks around.

mp_timelimit 25
mp_fraglimit 0
mp_roundtime 3
mp_freezetime 3
mp_startmoney 800
mp_maxmoney 16000
mp_buytime 0.5
mp_buy_anywhere 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_autokick 0
mp_round_restart_delay 5
mp_maxrounds 0
mp_winlimit 0
mp_c4timer 35

mp_freeforall 0
mp_round_infinite 0
mp_forcerespawn 0
mp_respawn_immunitytime 0
mp_give_player_c4 1
mp_weapons_allow_map_placed 1
mp_item_staytime 300
mp_infinite_ammo 0
mp_infinite_grenades 0
mp_refill_bpammo_weapons 0
mp_free_armor 0
mp_default_weapons_random 0
mp_t_default_weapons_primary ""
mp_ct_default_weapons_primary ""
mp_t_default_weapons_secondary "glock18"
mp_ct_default_weapons_secondary "usp"
mp_t_default_grenades ""
mp_ct_default_grenades ""
mp_falldamage 1

sv_gravity 800
sv_airaccelerate 10
sv_autobunnyhopping 0
sv_enablebunnyhopping 0

fun_hook_enabled 1
fun_hook_admin_only 0
fun_parachute_enabled 1

// Bots are ReGameDLL's zBot (bot_enable 1 in game_init.cfg). The block
// below holds the package defaults; the Server Control window reads them
// and saves the host's own values in local_bots.cfg, which fun_modes runs
// right after this file. Keep the markers and the cvar "value" format.
// --- Bots (Server Control) ---
bot_difficulty "1"
bot_quota "8"
bot_quota_mode "fill"
bot_join_team "any"
bot_join_after_player "0"
bot_auto_vacate "1"
bot_deathmatch "0"
bot_defer_to_human "1"
bot_allow_pistols "1"
bot_allow_shotguns "1"
bot_allow_sub_machine_guns "1"
bot_allow_rifles "1"
bot_allow_snipers "0"
bot_allow_machine_guns "0"
bot_allow_grenades "1"
bot_allow_shield "0"
bot_chatter "normal"
// --- End Bots ---
