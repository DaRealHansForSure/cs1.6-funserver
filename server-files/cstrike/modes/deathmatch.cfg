// Deathmatch: free for all, instant respawn, random weapon on spawn and
// buy anywhere. The hook stays on, which makes for nice chaos.

mapcyclefile "mapcycle_deathmatch.txt"

mp_timelimit 15
mp_freeforall 1
mp_round_infinite 1
mp_forcerespawn 1
mp_respawn_immunitytime 2
mp_freezetime 0
mp_startmoney 16000
mp_buytime -1
mp_buy_anywhere 1
mp_give_player_c4 0
mp_item_staytime 10
mp_refill_bpammo_weapons 3
mp_free_armor 2
mp_default_weapons_random 1
mp_t_default_weapons_primary "ak47 m4a1 awp mp5navy famas galil scout m3"
mp_ct_default_weapons_primary "ak47 m4a1 awp mp5navy famas galil scout m3"
mp_t_default_weapons_secondary "deagle"
mp_ct_default_weapons_secondary "deagle"
mp_t_default_grenades "hegrenade"
mp_ct_default_grenades "hegrenade"
mp_autoteambalance 0
mp_limitteams 0

// Bots only fight, there is no bomb or hostage to care about
bot_deathmatch 1
